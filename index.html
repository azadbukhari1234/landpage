<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Personal Landing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Animations */
        @keyframes zoomFade {
            0% { opacity: 0; transform: scale(1); }
            10% { opacity: 1; }
            30% { opacity: 1; }
            50% { opacity: 0; transform: scale(1.1); }
            100% { opacity: 0; transform: scale(1.1); }
        }

        .bg-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            animation: zoomFade 18s infinite;
        }

        /* Stagger background animations (3 images, 18s total cycle, 6s overlap/shift) */
        .bg-slide:nth-child(1) { animation-delay: 0s; }
        .bg-slide:nth-child(2) { animation-delay: 6s; }
        .bg-slide:nth-child(3) { animation-delay: 12s; }

        /* Text Entrance Animations */
        @keyframes floatUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-enter {
            animation: floatUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            opacity: 0; /* Start hidden */
        }

        /* Lighting/Glow Animation for the Box */
        @keyframes shine {
            0% { left: -100%; }
            20% { left: 100%; }
            100% { left: 100%; }
        }
        
        .lighting-box {
            position: relative;
            overflow: hidden;
        }
        
        .lighting-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.4), transparent);
            transform: skewX(-25deg);
            animation: shine 4s infinite;
        }

        .delay-100 { animation-delay: 0.2s; }
        .delay-200 { animation-delay: 0.4s; }
        .delay-300 { animation-delay: 0.6s; }
        .delay-500 { animation-delay: 1.0s; }
    </style>
</head>
<body class="bg-black h-screen w-screen overflow-hidden font-sans text-white relative">

    <!-- Background Slideshow -->
    <div class="fixed inset-0 z-0">
        <!-- REPLACE THE URLs BELOW WITH YOUR IMAGE LINKS -->
        <!-- Using Unsplash placeholders for demonstration -->
        <div class="bg-slide" style="background-image: url('https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?q=80&w=2000&auto=format&fit=crop');"></div>
        <div class="bg-slide" style="background-image: url('https://images.unsplash.com/photo-1507652313519-d4e9174996dd?q=80&w=2000&auto=format&fit=crop');"></div>
        <div class="bg-slide" style="background-image: url('https://images.unsplash.com/photo-1540932239986-30128078f3c5?q=80&w=2000&auto=format&fit=crop');"></div>
        <!-- Dark Overlay for Readability -->
        <div class="absolute inset-0 bg-black/60 z-10"></div>
    </div>

    <!-- Main Content -->
    <div class="relative z-20 h-full flex flex-col justify-center items-center text-center px-4">
        
        <!-- Status Indicator (Blinking Dot) -->
        <div class="animate-enter delay-100 mb-6 flex items-center space-x-2 bg-white/10 backdrop-blur-md py-1 px-3 rounded-full border border-white/20">
            <span class="relative flex h-3 w-3">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
            </span>
            <span class="text-xs tracking-widest uppercase text-emerald-100">Available for New Projects</span>
        </div>

        <!-- Headline -->
        <h1 class="animate-enter delay-200 text-5xl md:text-7xl font-light tracking-tight mb-4 text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-yellow-100 to-amber-200">
            Azad Bukhari
        </h1>
        
        <!-- Subtitle -->
        <p class="animate-enter delay-300 text-lg md:text-xl text-gray-300 font-light max-w-md mb-12 leading-relaxed">
            Crafting digital experiences, architecture with precision, and living.
        </p>

        <!-- Lighting Box / Action Button -->
        <a href="#" class="animate-enter delay-500 group relative">
            <div class="lighting-box flex items-center justify-between w-64 p-4 bg-white/5 backdrop-blur-sm border border-white/10 hover:border-amber-400/50 transition-all duration-500 rounded-lg shadow-2xl hover:shadow-amber-900/20">
                
                <!-- Text -->
                <div class="flex flex-col text-left">
                    <span class="text-xs text-gray-400 uppercase tracking-wider mb-1">Explore</span>
                    <span class="text-lg font-medium text-white group-hover:text-amber-300 transition-colors">View Portfolio</span>
                </div>

                <!-- Icon/Symbol -->
                <div class="h-10 w-10 rounded-full bg-gradient-to-br from-amber-300 to-yellow-600 flex items-center justify-center text-black shadow-lg transform group-hover:scale-110 group-hover:rotate-45 transition-transform duration-500">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 19.5l15-15m0 0H8.25m11.25 0v11.25" />
                    </svg>
                </div>
            </div>
        </a>

    </div>

    <!-- Footer / Socials Placeholder -->
    <div class="animate-enter absolute bottom-8 w-full text-center z-20 opacity-0" style="animation-delay: 1.5s; animation-fill-mode: forwards;">
        <p class="text-xs text-gray-500 tracking-widest uppercase">© 2025 • Landing Page</p>
    </div>

</body>
</html>
